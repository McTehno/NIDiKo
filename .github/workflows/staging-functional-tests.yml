name: Staging functional tests (external services)

# Explicit integration check of the deployed app, including the real Supabase service.
# The isolated suite in CI does not claim to verify this external dependency.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  selenium-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Selenium
        run: python -m pip install -r backend/tests/functional/requirements.txt
      - name: Prepare Chrome and matching driver
        run: |
          python - <<'PY'
          import os
          from selenium.webdriver.common.selenium_manager import SeleniumManager
          paths = SeleniumManager().binary_paths(['--browser', 'chrome'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f"CHROME_BINARY={paths['browser_path']}\n")
              output.write(f"CHROMEDRIVER={paths['driver_path']}\n")
          PY
      - name: Run all scenarios against deployed app
        run: |
          python backend/tests/functional/run_functional_tests.py \
            --base-url http://46.225.17.135 \
            --output-dir test-results/staging
      - name: Upload staging results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-staging-results
          path: test-results/staging/
          if-no-files-found: error
          retention-days: 14
