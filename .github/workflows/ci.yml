name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend-build:
    name: Backend build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      MONGODB_URI: mongodb://127.0.0.1:27017
      DATABASE_NAME: nidiko_functional_unit
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check backend app import
        run: python -c "from app.main import app; print('Backend app imported successfully')"

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    needs: backend-build

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      MONGODB_URI: mongodb://127.0.0.1:27017
      DATABASE_NAME: nidiko_functional_unit
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip show pytest
          python -m pip show pytest-asyncio

      - name: Run backend tests with coverage
        run: |
          python -m pytest --asyncio-mode=auto --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Generate Coverage Step Summary
        if: always()
        run: |
          echo "### Python Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            backend/coverage.xml
            backend/htmlcov
          retention-days: 14

  functional-tests:
    name: Functional tests
    uses: ./.github/workflows/functional-tests.yml
