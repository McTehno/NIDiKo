name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check backend app import
        run: python -c "from app.main import app; print('Backend app imported successfully')"

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: backend-build

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip show pytest
          python -m pip show pytest-asyncio

      - name: Run backend tests with coverage
        run: |
          python -m pytest --asyncio-mode=auto --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Generate Coverage Step Summary
        if: always()
        run: |
          echo "### Python Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            backend/coverage.xml
            backend/htmlcov
          retention-days: 14

  auth-ui-tests:
    name: Login UI functional test (controlled Auth response)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_SUPABASE_URL: https://functional-test.supabase.co
      VITE_SUPABASE_ANON_KEY: functional-test-anon-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Selenium
        run: python -m pip install "selenium>=4.25.0"

      - name: Build local frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Start local frontend
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 5179 --strictPort > /tmp/nidiko-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:5179/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nidiko-preview.log
          exit 1

      - name: Check invalid-credentials UI contract
        run: python backend/tests/functional/run_auth_ui_test.py --output-dir test-results/auth-ui

      - name: Upload login UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-ui-controlled-auth-results
          path: test-results/auth-ui/
          retention-days: 14
